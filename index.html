<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Olympiad Practice - JSON Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
            <div>
                <h1 class="text-2xl font-bold text-indigo-600">Math Olympiad Practice</h1>
                <p class="text-sm text-slate-500">Loaded from <code class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-700">moems_all_220_problems_store.json</code></p>
            </div>
            <div id="progress-badge" class="bg-indigo-50 text-indigo-700 font-semibold px-3 py-1 rounded-full text-sm">
                Loading...
            </div>
        </div>

        <!-- Loading / Error State -->
        <div id="loading-state" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent mb-3"></div>
            <p class="text-slate-600 font-medium">Loading your 220 math problems...</p>
        </div>

        <!-- Main Quiz Content (Hidden until loaded) -->
        <div id="quiz-content" class="hidden">
            <!-- Question Area -->
            <div class="mb-6">
                <h2 id="question-text" class="text-lg font-semibold text-slate-800 mb-4"></h2>
                
                <!-- Diagram / Figure Container -->
                <div id="diagram-container" class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex justify-center items-center mb-6 min-h-[180px]">
                    <!-- Dynamic SVG or image injected here -->
                </div>
            </div>

            <!-- Answer Input Area -->
            <div class="space-y-4">
                <div class="flex gap-2">
                    <input type="text" id="user-answer" placeholder="Enter your answer (e.g., 1/2, 0.5, 72 cm)..." class="flex-1 px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-lg">
                    <button id="submit-btn" onclick="checkAnswer()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition shadow-md">Submit</button>
                </div>
                
                <!-- Feedback Area -->
                <div id="feedback-area" class="hidden p-4 rounded-xl text-sm font-medium"></div>
            </div>

            <!-- Navigation Footer -->
            <div class="mt-8 pt-4 border-t border-slate-100 flex justify-between items-center">
                <span id="score-display" class="text-sm font-medium text-slate-600">Score: 0 / 0</span>
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition">Next Question &rarr;</button>
            </div>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        // Fetch the 220 question JSON store on startup
        async function loadQuestionsStore() {
            try {
                const response = await fetch('moems_all_220_problems_store.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                // Handle different JSON structures (array directly or nested under an object property like { problems: [...] })
                questions = Array.isArray(data) ? data : (data.problems || data.questions || []);

                if (questions.length === 0) {
                    throw new Error("No questions found in the JSON file.");
                }

                // Hide loading spinner and show quiz interface
                document.getElementById("loading-state").classList.add("hidden");
                document.getElementById("quiz-content").classList.remove("hidden");
                
                loadQuestion();
            } catch (error) {
                console.error("Failed to load question store:", error);
                document.getElementById("loading-state").innerHTML = `
                    <div class="text-rose-600 font-semibold mb-2">⚠️ Could not load question store</div>
                    <p class="text-sm text-slate-500 mb-4">Please ensure <code class="bg-slate-100 px-1 py-0.5 rounded">moems_all_220_problems_store.json</code> is in the same directory as this file, or check your server configuration.</p>
                    <button onclick="loadQuestionsStore()" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium">Retry</button>
                `;
            }
        }

        function loadQuestion() {
            answered = false;
            const q = questions[currentIndex];
            document.getElementById("progress-badge").textContent = `Question ${currentIndex + 1} of ${questions.length}`;
            document.getElementById("question-text").textContent = q.text || q.question;
            
            // Render diagram if present in JSON schema, otherwise show a clean placeholder or hidden state
            const diagramContainer = document.getElementById("diagram-container");
            if (q.diagram) {
                diagramContainer.innerHTML = q.diagram;
                diagramContainer.classList.remove("hidden");
            } else {
                diagramContainer.innerHTML = `<span class="text-slate-400 text-sm">No diagram for this question</span>`;
            }
            
            const input = document.getElementById("user-answer");
            input.value = "";
            input.disabled = false;
            input.focus();

            const feedback = document.getElementById("feedback-area");
            feedback.className = "hidden p-4 rounded-xl text-sm font-medium";
            feedback.textContent = "";

            document.getElementById("submit-btn").textContent = "Submit";
            document.getElementById("next-btn").classList.add("hidden");
        }

        function parseFraction(str) {
            if (str.includes('/')) {
                const parts = str.split('/');
                if (parts.length === 2) {
                    const num = parseFloat(parts[0]);
                    const den = parseFloat(parts[1]);
                    if (!isNaN(num) && !isNaN(den) && den !== 0) {
                        return num / den;
                    }
                }
            }
            return null;
        }

        function cleanAndEvaluateInput(rawInput) {
            let cleaned = rawInput.trim().toLowerCase();
            const q = questions[currentIndex];
            const accepted = q.acceptedAnswers || q.accepted_answers || [String(q.answer)];

            if (accepted.map(a => String(a).toLowerCase()).includes(cleaned)) {
                return true;
            }

            const fractionVal = parseFraction(cleaned);
            const targetVal = q.numericValue !== undefined ? q.numericValue : parseFloat(q.answer);

            if (fractionVal !== null && !isNaN(targetVal)) {
                return Math.abs(fractionVal - targetVal) <= (q.tolerance || 0.01);
            }

            const numericStr = cleaned.replace(/[^0-9.\-]/g, '');
            const val = parseFloat(numericStr);
            if (!isNaN(val) && !isNaN(targetVal)) {
                return Math.abs(val - targetVal) <= (q.tolerance || 0.01);
            }

            return false;
        }

        function checkAnswer() {
            if (answered) return;
            const inputVal = document.getElementById("user-answer").value;
            if (!inputVal.trim()) {
                alert("Please enter an answer!");
                return;
            }

            answered = true;
            const isCorrect = cleanAndEvaluateInput(inputVal);
            const feedback = document.getElementById("feedback-area");
            feedback.classList.remove("hidden");

            const q = questions[currentIndex];
            const accepted = q.acceptedAnswers || q.accepted_answers || [q.answer];
            const explanation = q.explanation || "No explanation provided.";

            if (isCorrect) {
                score++;
                feedback.className = "p-4 rounded-xl text-sm font-medium bg-emerald-50 text-emerald-800 border border-emerald-200";
                feedback.innerHTML = `<strong>Correct! 🎉</strong> ${explanation}`;
            } else {
                feedback.className = "p-4 rounded-xl text-sm font-medium bg-rose-50 text-rose-800 border border-rose-200";
                feedback.innerHTML = `<strong>Incorrect.</strong> Accepted answers include: <em>${Array.isArray(accepted) ? accepted.join(", ") : accepted}</em>.<br>${explanation}`;
            }

            document.getElementById("user-answer").disabled = true;
            document.getElementById("score-display").textContent = `Score: ${score} / ${questions.length}`;
            
            if (currentIndex < questions.length - 1) {
                document.getElementById("next-btn").classList.remove("hidden");
                document.getElementById("submit-btn").textContent = "Answered";
            } else {
                document.getElementById("submit-btn").textContent = "Complete!";
                document.getElementById("feedback-area").innerHTML += `<br><br><strong>Quiz Finished! Final Score: ${score} / ${questions.length}</strong>`;
            }
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) {
                loadQuestion();
            }
        }

        // Initialize by loading the JSON store file
        loadQuestionsStore();

        document.getElementById("user-answer").addEventListener("keypress", function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
    </script>
</body>
</html>
